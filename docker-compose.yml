services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/datasets
      - ./backend/uploads:/app/uploads
      - ./backend/reports_out:/app/reports_out
    environment:
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
